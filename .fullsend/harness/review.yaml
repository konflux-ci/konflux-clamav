# Review agent harness overlay.
# Inherits the default review harness and skips review for the
# MintMaker bot (red-hat-konflux) to avoid unnecessary agent cost
# on automated dependency-bump PRs.
base: https://raw.githubusercontent.com/fullsend-ai/agents/9f4c0eb3dd1207b3c3c3586f413f625a55720990/harness/review.yaml#sha256=3992c18ce6efa2a9590afccb61b90ec4c3bb5428727254bafe0cde262c53bfcb
env:
  runner:
    REVIEW_SKIP_AUTHORS: "app/red-hat-konflux"